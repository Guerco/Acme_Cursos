<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Cursos</title>

    <script type="module" src="./src/index.ts"></script>

    <style>
        /* ========================================================== */
        /* Estilo dos Cards */
        body {
            background-color: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        .secao-cursos {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 100%;
            margin: 0 auto;
        }

        
        .card-curso {
            border-color: rgb(214, 214, 214);
            border-style: solid;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column; 
            gap: 10px; 
        }
        
        .card-curso:hover {
            cursor: pointer;
        }
        
        .secao-curso {
            display: flex;
        }

        .secao-curso figure {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .secao-curso figure img {
            width: 120px;
            height: 100px;
            border-radius: 10px;
        }

        .secao-curso-lateral {
            flex: 4; 
            padding-left: 15px;
            display: flex;
            flex-direction: column;
        }

        .curso-acoes {
            display: flex;
            justify-content: flex-end; 
        }

        .botao-exibir-assuntos {
            background: none;
            border: 1px solid #35bfe9;
            color: #35bfe9;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .botao-exibir-assuntos:hover {
            background-color: rgba(0, 86, 179, 0.1);
        }

        .botao-exibir-assuntos:active {
            transform: scale(0.97);
        }
        /* ========================================================== */
        /* Estilo dos Assuntos */
        .secao-assuntos .tabela-assuntos {
            width: 100%;
            border-collapse: collapse;
        }

        .secao-assuntos .tabela-assuntos td {
            padding: 4px 8px;
        }

        .secao-assuntos .tabela-assuntos tr.tr-assunto {
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
        }
        /* ========================================================== */

    </style>

</head>
<body>
    <form id="form-busca">
        <label for="input-busca">
            Busque por nome do curso ou professor:
        </label>
        <input type="search" id="input-busca">
        <button>🔍</button>
    </form>

    <h1>Listagem de Cursos</h1>

    <section id="sec-cursos" class="secao-cursos">
    </section>
</body>
</html>
