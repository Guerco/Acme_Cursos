<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz - Cadastro de Perguntas</title>

    <link rel="icon" href="../img/favicon.ico" />
    <script type="module" src="../src/scripts/cadastro-perguntas.ts"></script>
    <link rel="stylesheet" href="../style/menu.css" />
    <link rel="stylesheet" href="../style/cadastro-perguntas.css" />
    <script type="module" src="../src/scripts/menu.ts"></script>
</head>

<body>
    <header></header>
    <div id="cadastro">
        <h2>Cadastro de Pergunta</h2>
        <p class="mensagem-campos-obrigatorios">Campos marcados com * são obrigatórios.</p>
        <form id="form-cadastro">
            <div id="info-pergunta">
                <div class="container-campos">
                    <label for="professor">👨‍🏫 Professor *</label>
                    <select name="professor" id="professor" required>
                        <option value="" hidden selected>Selecione um Professor</option>
                    </select>
                </div>

                <div class="container-campos">
                    <label for="curso">🎓 Curso *</label>
                    <select name="curso" id="curso" required disabled>
                        <option value="" hidden selected>Selecione primeiro um Professor</option>
                    </select>
                </div>

                <div class="container-campos">
                    <label for="assunto">💬 Assunto *</label>
                    <select name="assunto" id="assunto" required disabled>
                        <option value="" hidden selected>Selecione primeiro um Curso</option> 
                    </select>
                </div>

                <div class="container-campos">
                    <label for="dificuldade">🧠 Nível de Dificuldade *</label>
                    <select name="dificuldade" id="dificuldade" required>
                        <option value="" hidden selected>Selecione o nível de dificuldade</option>
                        <option value="facil">Fácil (1.0)</option>
                        <option value="medio">Médio (1.5)</option>
                        <option value="dificil">Difícil (2.0)</option>
                    </select>
                </div>

                <div class="container-campos">
                    <label for="tempo-segundos">⏱️ Tempo em Segundos *</label>
                    <input type="number" name="tempo-segundos" id="tempo-segundos" min="30" max="180" value="60" required>
                </div>

                <div class="container-campos">
                    <label for="descricao">📝 Enunciado da Pergunta *</label>
                    <textarea name="descricao" id="descricao" placeholder="Preencha a enunciado" minlength="10"
                        maxlength="255"></textarea>
                </div>

                <div class="container-campos">
                    <label for="figura">🖼️ Selecione ou arraste a figura</label>
                    <input type="file" name="figura" id="figura" accept="image/png, image/jpeg">
                </div>

                <label for="resposta-1">🗨️ Preencha as Respostas *</label>
                <table>
                    <tbody>
                        <tr class="container-resposta">
                            <td>
                                <input type="checkbox" id="correta-1" name="resposta-correta" class="check-resposta-correta" checked>
                                <label for="correta-1" class="label-resposta-correta" title="A resposta é correta?">Correta</label>
                            </td>
                            <td>
                                <input type="text" name="resposta" placeholder="Digite a resposta 1" minlength="1"
                                    maxlength="200" required id="resposta-1">
                            </td>
                        </tr>

                        <tr class="container-resposta">
                            <td>
                                <input type="checkbox" id="correta-2" name="resposta-correta" class="check-resposta-correta">
                                <label for="correta-2" class="label-resposta-correta" title="A resposta é correta?">Correta</label>
                            </td>
                            <td>
                                <input type="text" name="resposta" placeholder="Digite a resposta 2" minlength="1"
                                    maxlength="200" required>
                            </td>
                        </tr>

                        <tr class="container-resposta" hidden>
                            <td>
                                <input type="checkbox" id="correta-3" name="resposta-correta" class="check-resposta-correta" disabled>
                                <label for="correta-3" class="label-resposta-correta" title="A resposta é correta?">Correta</label>
                            </td>
                            <td>
                                <input type="text" name="resposta" placeholder="Digite a resposta 3" minlength="1"
                                    maxlength="200" required disabled>
                            </td>
                        </tr>

                        <tr class="container-resposta" hidden>
                            <td>
                                <input type="checkbox" id="correta-4" name="resposta-correta" class="check-resposta-correta" disabled>
                                <label for="correta-4" class="label-resposta-correta" title="A resposta é correta?">Correta</label>
                            </td>
                            <td>
                                <input type="text" name="resposta" placeholder="Digite a resposta 4" minlength="1"
                                    maxlength="200" required disabled>
                            </td>
                        </tr>

                        <tr class="container-resposta" hidden>
                            <td>
                                <input type="checkbox" id="correta-5" name="resposta-correta" class="check-resposta-correta" disabled>
                                <label for="correta-5" class="label-resposta-correta" title="A resposta é correta?">Correta</label>
                            </td>
                            <td>
                                <input type="text" name="resposta" placeholder="Digite a resposta 5" minlength="1"
                                    maxlength="200" required disabled>
                            </td>
                        </tr>
                    </tbody>

                    <tfoot>
                        <tr>
                            <td colspan="2">
                                <div class="acoes-respostas">
                                    <button type="button" name="adicionar-resposta" id="adicionar-resposta">+</button>
                                    <button type="button" name="remover-resposta" id="remover-resposta"
                                        disabled>-</button>
                                </div>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div id="acoes">
                <div class="botoes">
                    <a href="../index.html" id="botao-cancelar"><button type="button">Cancelar</button></a>
                    <button type="submit" id="botao-cadastrar">Cadastrar</button>
                </div>
                <ul id="mensagem-cadastro"></ul> 
            </div>
        </form>
    </div>
</body>

</html>
