<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz - Cadastro de Perguntas</title>
    <link rel="icon" href="../img/favicon.ico" />
    <script type="module" src="../src/scripts/cadastro-perguntas.ts"></script>
</head>

<body>
    <div id="cadastro">
        <h2>Cadastro de Pergunta</h2>
        <form id="form-cadastro">
            <div id="info-pergunta">
                <label for="professor">Professor:</label>
                <select name="professor" id="professor" required>
                    <option value="" hidden selected>Selecione um Professor</option>
                </select><br>

                <label for="curso">Curso:</label>
                <select name="curso" id="curso" required disabled>
                    <option value="" hidden selected>Selecione um Curso</option>
                </select> <br>

                <label for="assunto">Assunto:</label>
                <select name="assunto" id="assunto" required disabled>
                    <option value="" hidden selected>Selecione um Assunto</option>
                </select> <br>

                <label for="dificuldade">Nível de Dificuldade:</label>
                <select name="dificuldade" id="dificuldade" required>
                    <option value="" hidden selected>Selecione o nível de dificuldade</option>
                    <option value="facil">Fácil (1.0)</option>
                    <option value="medio">Médio (1.5)</option>
                    <option value="dificil">Difícil (2.0)</option>
                </select> <br>

                <label for="descricao">Enunciado da Pergunta:</label> <br>
                <textarea name="descricao" id="descricao" placeholder="Preencha a enunciado" minlength="10"
                    maxlength="255"></textarea> <br>

                <label for="figura">Escolha a Figura</label> <br>
                <input type="file" name="figura" id="figura" accept="image/png, image/jpeg"> <br>
                <img id="preview-figura" width="200" accept="image/png, image/jpeg"> <br>

                <h3>Preencha as Respostas</h3>

                <table>
                    <thead>
                        <tr>
                            <th>Correta</th>
                            <th>Conteúdo</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="container-resposta">
                            <td><input type="checkbox" name="resposta-correta" checked></td>
                            <td><input type="text" name="resposta" placeholder="Digite a resposta 1" minlength="10" maxlength="200" required></td>
                        </tr>
                        <tr class="container-resposta">
                            <td><input type="checkbox" name="resposta-correta"></td>
                            <td><input type="text" name="resposta" placeholder="Digite a resposta 2" minlength="10" maxlength="200" required></td>
                        </tr>
                        <tr class="container-resposta" hidden>
                            <td><input type="checkbox" name="resposta-correta" disabled></td>
                            <td><input type="text" name="resposta" placeholder="Digite a resposta 3" minlength="10" maxlength="200" required disabled>
                            </td>
                        </tr>
                        <tr class="container-resposta" hidden>
                            <td><input type="checkbox" name="resposta-correta" disabled></td>
                            <td><input type="text" name="resposta" placeholder="Digite a resposta 4" minlength="10" maxlength="200" required disabled>
                            </td>
                        </tr>
                        <tr class="container-resposta" hidden>
                            <td><input type="checkbox" name="resposta-correta" disabled></td>
                            <td><input type="text" name="resposta" placeholder="Digite a resposta 5" minlength="10" maxlength="200" required disabled>
                            </td>
                        </tr>
                    </tbody>

                    <tfoot>
                        <tr>
                            <td><button type="button" name="adicionar-resposta" id="adicionar-resposta">➕</button></td>
                            <td><button type="button" name="remover-resposta" id="remover-resposta" disabled>➖</button>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div id="acoes">
                <output id="mensagem-cadastro"></output>
                <div  class="botoes">
                    <a href="../index.html"><button type="button">Cancelar</button></a>
                    <button type="submit">Cadastrar</button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
