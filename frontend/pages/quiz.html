<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listagem de Perguntas</title>
    <link rel="stylesheet" href="../style/quiz.css" />
    <link rel="icon" href="../img/favicon.ico">
    <script type="module" src="../src/scripts/quiz.ts"></script>
  </head>

  <body>
    <dialog id="caixa-credenciais">
      <div class="logo-credenciais">
        <img src="../img/logotipo.png" alt="Logotipo Quiz" />
      </div>
      <form id="form-credenciais" method="dialog">
        <h1>Informe suas Credenciais</h1>
        <div class="inputs-credenciais">
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Digite seu Email"
          /><br /><br />
          <input
            type="password"
            id="senha"
            name="senha"
            required
            placeholder="Digite sua Senha"
          /><br /><br />
        </div>
        <div class="acoes-credenciais">
          <output></output>
          <button id="botao-enviar">Enviar</button>
          <button id="botao-cancelar" type="button">
            Voltar para Cursos 🏡
          </button>
        </div>
      </form>
    </dialog>

    <header hidden>
      <div class="informacoes-aluno">
        <h3 id="usuario"></h3>

        <div class="container-pontuacoes">
          <div class="container-pontuacao">
            <label for="pontuacao-geral">🏆 Geral</label>
            <input
              id="pontuacao-geral"
              type="number"
              value="0.0"
              disabled=""
              class="input-pontuacao"
            />
          </div>
          <div class="container-pontuacao">
            <label for="pontuacao-curso">🎯 Curso</label>
            <input
              id="pontuacao-curso"
              type="number"
              value="0.0"
              disabled=""
              class="input-pontuacao"
            />
          </div>
        </div>
      </div>
    </header>

    <div id="quiz">
      <button id="botao-informar-credenciais">Informar Credenciais</button>
    </div>

    <footer id="acoes" hidden>
      <h2 id="contagem"></h2>
      <h2 id="mensagem-resposta"></h2>
      <button id="acao"></button>
    </footer>
  </body>
</html>
