<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="icon" href="../img/favicon.ico" />
    
    <script type="module" src="../src/scripts/quiz.ts"></script>
    
    <link rel="stylesheet" href="../style/quiz.css" />
  </head>

  <body>
    <header hidden>
      <div class="informacoes-aluno">
        <h3 id="usuario"></h3>

        <div class="container-pontuacoes">
          <div class="container-pontuacao">
            <label for="pontuacao-geral">🏆 Geral</label>
            <input
              id="pontuacao-geral"
              type="number"
              value="0.0"
              disabled=""
              class="input-pontuacao"
            />
          </div>
          <div class="container-pontuacao">
            <label for="pontuacao-curso">🎯 Curso</label>
            <input
              id="pontuacao-curso"
              type="number"
              value="0.0"
              disabled=""
              class="input-pontuacao"
            />
          </div>
        </div>
      </div>

      <div class="atencao-tela-cheia">
        <span>
          ⚠️ Ao sair da tela cheia ou ao tirar o foco da página, sua resposta
          será computada e o quiz se encerrará!
        </span>
      </div>
    </header>

    <div id="quiz">
    </div>

    <footer id="acoes" hidden>
      <h2 id="contagem"></h2>
      <h2 id="mensagem-resposta"></h2>
      <button id="acao"></button>
    </footer>
  </body>
</html>
