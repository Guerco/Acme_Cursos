<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Usuários</title>
    <link rel="icon" href="../img/favicon.ico" />
    
    <script type="module" src="../src/scripts/elementos/menu.ts"></script>
    <script type="module" src="../src/scripts/listagem-usuario.ts"></script>

    <link rel="stylesheet" href="../style/elementos/menu.css" />
    <link rel="stylesheet" href="../style/listagem-usuarios.css" />
</head>
<body>
    <div id="secao-usuarios">
        <h1>Usuários</h1>

        <div class="opcoes-listagem">
            <div class="container-tipo-usuario">
                <label for="tipo-usuario">🏷️</label>
                <select name="tipo-usuario" id="tipo-usuario">
                    <option value="" selected>Todos Cargos</option>
                    <option value="aluno">Alunos</option>
                    <option value="professor">Professores</option>
                    <option value="administrador">Administradores</option>
                    <option value="professor-administrador">Professores-Administradores</option>
                </select>
            </div>

            <form id="form-busca">
                <input type="search" id="input-busca" placeholder="Buscar usuário" />
                <button id="botao-buscar">🔍</button>
            </form>
        </div>

        <output id="mensagem"></output>
        <div class="container-usuarios">
            <table>
                <tbody></tbody>
            </table>
        </div>
    </div>
</body>
</html>
